# Continuous integration for InternTrack.
#
# Runs the Django checks and the full test suite against a real PostgreSQL
# database on every push (any branch) and every pull request.
#
# No repository secrets are needed: the database below is a throwaway
# container that exists only for the lifetime of one CI run, and the Django
# SECRET_KEY is freshly generated on each run. A developer's local `.env` is
# never used (it is git-ignored and not present on the runner).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django tests (Python 3.11, PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Same image as docker-compose.yml so CI matches local development.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: interntrack
          POSTGRES_USER: interntrack
          POSTGRES_PASSWORD: ci-only-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interntrack -d interntrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_TIME_ZONE: UTC
      POSTGRES_DB: interntrack
      POSTGRES_USER: interntrack
      POSTGRES_PASSWORD: ci-only-throwaway-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONNECT_TIMEOUT: "5"
      PYTHONUNBUFFERED: "1"

    steps:
      # Actions are pinned to full commit SHAs (tag shown in the comment) so a
      # moved or compromised tag cannot change what runs here.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate a per-run Django secret key
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2
